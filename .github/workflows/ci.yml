name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Manual runs from the Actions tab (same jobs, no release).
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # Structural checks that do not need kernel observers, elevated rights, or
      # a running server: egg building, process classification (including the
      # tool prior), the Absence Report engine against recorded fixtures, and the
      # Codex layer (command parsing, shell-wrapper stripping, env policy, and
      # the exec-server protocol over a loopback socket).
      # (check:history and the observer checks need a live server / kernel
      # access, so they stay manual: `npm run check:process`, `npm run
      # check:history`.)
      # check:offline spawns every offline check script in one go; the list of
      # scripts lives in scripts/checks/run-offline.ts (a new check is
      # registered in exactly one place).
      - run: npm run check:offline

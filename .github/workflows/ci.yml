name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Structural checks that do not need kernel observers, elevated rights, or
      # a running server: egg building, process classification (including the
      # tool prior), and the Daze Report engine run against recorded fixtures.
      # (check:history and the observer checks need a live server / kernel
      # access, so they stay manual: `npm run check:process`, `npm run
      # check:history`.)
      - run: npm run check:eggs
      - run: npm run check:classify
      - run: npm run check:report

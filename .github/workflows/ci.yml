name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Manual runs from the Actions tab (same jobs, no release).
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # Structural checks, plus the ones that boot their own server on an
      # ephemeral port with an isolated state dir: session dwell/close, metrics
      # restart, observed lifetime, and the History/Replay assertions. Nothing
      # has to be running beforehand, and with no kernel observer binary the
      # watcher falls back to `ps` snapshots, so these pass on a runner too.
      #
      # What stays manual is the tier that needs kernel privileges or docker:
      # check-agentwatch, check-ebpf, check-docker, check-docker-eggs, check-e2e.
      # The full offline list lives in scripts/checks/run-offline.ts (a new
      # check is registered in exactly one place).
      - run: npm run check:offline

# Release notes grouping for GitHub's auto-generated notes.
#
# Used by `.github/workflows/release.yml` only when there is no hand-written
# `docs/RELEASE_NOTES_v<version>.md` for the tag being released. Absence ships
# those bilingual notes for every release, so this is the fallback path.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
